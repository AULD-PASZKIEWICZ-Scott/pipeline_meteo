services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    container_name: weather_postgres
    environment:
      POSTGRES_USER: weather_user
      POSTGRES_PASSWORD: ${WEATHER_DB_PASSWORD}
      POSTGRES_DB: weather_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pipeline_network

volumes:
  postgres_data:
  
networks:
  pipeline_network:
    external: true